name: Test examples
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "git+https://github.com/Rayon-API/rayon-sdk-py.git" "pytest>=8,<10" "curl_cffi>=0.13,<1"
      - run: pytest
