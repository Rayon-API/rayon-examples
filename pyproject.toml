[project]
name = "rayon-examples"
version = "1.0.0"
description = "Runnable RayonAPI SDK examples"
requires-python = ">=3.10"
dependencies = ["rayon-sdk-py>=3.0.0,<4", "curl_cffi>=0.13,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
